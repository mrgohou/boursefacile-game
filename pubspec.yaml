name: paco_bourse
description: Jeu pédagogique mobile PACO Bourse — socle indépendant Flutter et Flame.
publish_to: none
version: 0.3.0+4
environment:
  sdk: '>=3.14.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: 1.11.0
  audioplayers: 6.8.1
  flame: 1.38.2
  shared_preferences: 2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
  assets:
    - assets/fonts/OFL.txt
    - assets/catalog.json
    - assets/paco/
    - assets/buildings/
    - assets/tiles/
    - assets/audio/
