name: paco_bourse
description: Jeu pédagogique mobile PACO Bourse — socle indépendant Flutter et Flame.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.14.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: 1.11.0
  flame: 1.38.2
  shared_preferences: 2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/catalog.json
    - assets/paco/
    - assets/buildings/
    - assets/tiles/
