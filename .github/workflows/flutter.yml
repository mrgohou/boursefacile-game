name: PACO Bourse (Flutter)

on:
  push:
    branches: ['v1/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Plateformes (générées, non versionnées)
        run: |
          flutter create . --platforms=android,web --project-name paco_bourse --org ci.boursefacile
          rm -f test/widget_test.dart

      - name: Préparation
        run: |
          mkdir -p ../ci-out
          flutter --version > ../ci-out/flutter-version.txt 2>&1
          flutter pub get 2>&1 | tee ../ci-out/pub-get.txt

      - name: Analyse
        timeout-minutes: 5
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee ../ci-out/analyze.txt; echo "analyze=$?" >> ../ci-out/status.txt

      - name: Tests du moteur
        timeout-minutes: 6
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --timeout=120s test/engine_test.dart test/market_test.dart test/city_layout_test.dart 2>&1 | tee ../ci-out/test-engine.txt; echo "engine=$?" >> ../ci-out/status.txt

      - name: Tests des écrans et captures
        timeout-minutes: 8
        continue-on-error: true
        run: |
          set -o pipefail
          PACO_SHOTS=1 flutter test --timeout=180s --update-goldens test/screens_test.dart 2>&1 | tee ../ci-out/test-screens.txt; echo "screens=$?" >> ../ci-out/status.txt
          mkdir -p ../ci-out/goldens && cp -r test/goldens/. ../ci-out/goldens/ 2>/dev/null || true

      - name: Capture du plateau (informatif)
        timeout-minutes: 5
        continue-on-error: true
        run: |
          PACO_SHOTS=1 flutter test --timeout=120s --update-goldens test/level_test.dart 2>&1 | tail -60 > ../ci-out/test-level.txt || true
          cp test/goldens/10-*.png ../ci-out/goldens/ 2>/dev/null || true

      - name: Build web
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build web --release --no-web-resources-cdn 2>&1 | tee ../ci-out/build-web.txt; echo "web=$?" >> ../ci-out/status.txt
          if [ -d build/web ]; then sed -i 's|<base href="/">|<base href="./">|' build/web/index.html; mkdir -p ../ci-out/web && cp -r build/web/. ../ci-out/web/; fi

      - name: Build APK
        timeout-minutes: 15
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi 2>&1 | tail -40 | tee ../ci-out/build-apk.txt; echo "apk=$?" >> ../ci-out/status.txt

      - name: Publier les résultats (branche ci-results)
        if: always()
        working-directory: ci-out
        run: |
          cat status.txt || true
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          echo "${GITHUB_SHA}" > sha.txt
          git checkout -q -b ci-results
          git add -A
          git commit -qm "CI ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-results

      - name: APK de test (pré-version ci-latest)
        if: hashFiles('app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ci-latest -y --cleanup-tag || true
          gh release create ci-latest build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk --prerelease --title "PACO Bourse — APK de test" --notes "Build automatique ${GITHUB_SHA}. Signature de test, à usage interne."

      - name: Échec si un contrôle a échoué
        if: always()
        run: "! grep -E '=[1-9]' ../ci-out/status.txt"
